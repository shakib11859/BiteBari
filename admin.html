<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiteBari - Admin Dashboard</title>
    <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <style>
        .admin-container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 30px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        #dashboard { display: none; }
        .product-list { margin-top: 30px; }
        .product-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            border-bottom: 1px solid #eee;
        }
        .product-item img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; margin-right: 15px; }
        .product-item-info { flex: 1; }
        .product-item-actions { display: flex; gap: 10px; }
    </style>
</head>
<body>

    <!-- Login Section -->
    <div class="login-container" id="loginSection">
        <h3 class="text-center mb-4">Admin Login</h3>
        <input type="password" id="adminPassword" class="form-control mb-3" placeholder="Enter Admin Password">
        <button class="btn btn-primary w-100" onclick="login()">Login</button>
        <p id="loginError" class="text-danger mt-2 text-center" style="display:none;">Incorrect Password (hint: admin123)</p>
    </div>

    <!-- Dashboard Section -->
    <div class="admin-container" id="dashboard">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Admin Dashboard</h2>
            <button class="btn btn-danger" onclick="logout()">Logout</button>
        </div>

        <button class="btn btn-success mb-4" onclick="showAddForm()"><i class="fas fa-plus"></i> Add New Product</button>

        <div id="addFormSection" style="display: none;" class="mb-4 p-4 border rounded bg-light">
            <h4>Add / Edit Product</h4>
            <input type="hidden" id="p-id">
            <input type="text" id="p-name" class="form-control mb-2" placeholder="Product Name">
            <input type="number" id="p-price" class="form-control mb-2" placeholder="Price (৳)">
            <textarea id="p-desc" class="form-control mb-2" placeholder="Description"></textarea>
            <input type="text" id="p-img" class="form-control mb-2" placeholder="Image URL (e.g. img/product/1.png)">
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="p-stock" checked>
                <label class="form-check-label" for="p-stock">In Stock</label>
            </div>
            <button class="btn btn-primary" onclick="saveProduct()">Save Product</button>
            <button class="btn btn-secondary" onclick="hideAddForm()">Cancel</button>
        </div>

        <div class="product-list" id="productList">
            <!-- Dynamic product list -->
        </div>
    </div>

    <script src="js/products-data.js"></script>
    <script>
        // Simple mock authentication
        function login() {
            if (document.getElementById('adminPassword').value === 'admin123') {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                renderAdminProducts();
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        function logout() {
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('adminPassword').value = '';
        }

        function showAddForm(id = null) {
            document.getElementById('addFormSection').style.display = 'block';
            if (id && window.PRODUCTS_DATA[id]) {
                const p = window.PRODUCTS_DATA[id];
                document.getElementById('p-id').value = id;
                document.getElementById('p-name').value = p.name;
                document.getElementById('p-price').value = p.price;
                document.getElementById('p-desc').value = p.description;
                document.getElementById('p-img').value = p.image;
                document.getElementById('p-stock').checked = p.inStock;
            } else {
                document.getElementById('p-id').value = 'new_' + Date.now();
                document.getElementById('p-name').value = '';
                document.getElementById('p-price').value = '';
                document.getElementById('p-desc').value = '';
                document.getElementById('p-img').value = 'img/product/placeholder.png';
                document.getElementById('p-stock').checked = true;
            }
        }

        function hideAddForm() {
            document.getElementById('addFormSection').style.display = 'none';
        }

        function saveProduct() {
            const id = document.getElementById('p-id').value;
            window.PRODUCTS_DATA[id] = {
                name: document.getElementById('p-name').value,
                price: parseFloat(document.getElementById('p-price').value).toFixed(2),
                description: document.getElementById('p-desc').value,
                image: document.getElementById('p-img').value,
                rating: 5,
                inStock: document.getElementById('p-stock').checked
            };
            saveProducts();
            hideAddForm();
            renderAdminProducts();
            alert("Product saved! The website will now display this product.");
        }

        function toggleAdminStock(id) {
            if (window.PRODUCTS_DATA[id]) {
                window.PRODUCTS_DATA[id].inStock = !window.PRODUCTS_DATA[id].inStock;
                saveProducts();
                renderAdminProducts();
            }
        }

        function deleteProduct(id) {
            if (confirm("Are you sure you want to delete this product?")) {
                delete window.PRODUCTS_DATA[id];
                saveProducts();
                renderAdminProducts();
            }
        }

        function renderAdminProducts() {
            const list = document.getElementById('productList');
            list.innerHTML = '';
            for (let id in window.PRODUCTS_DATA) {
                const p = window.PRODUCTS_DATA[id];
                const item = document.createElement('div');
                item.className = 'product-item';
                item.innerHTML = `
                    <div class="d-flex align-items-center">
                        <img src="${p.image}" alt="${p.name}" onerror="this.src='img/product/8.png'">
                        <div class="product-item-info">
                            <h5>${p.name}</h5>
                            <span class="badge ${p.inStock ? 'bg-success' : 'bg-danger'}">${p.inStock ? 'In Stock' : 'Out of Stock'}</span>
                            <span class="ms-2 fw-bold">৳ ${p.price}</span>
                        </div>
                    </div>
                    <div class="product-item-actions">
                        <button class="btn btn-sm btn-outline-primary" onclick="toggleAdminStock('${id}')">Toggle Stock</button>
                        <button class="btn btn-sm btn-outline-secondary" onclick="showAddForm('${id}')"><i class="fas fa-edit"></i> Edit</button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteProduct('${id}')"><i class="fas fa-trash"></i> Delete</button>
                    </div>
                `;
                list.appendChild(item);
            }
        }
    </script>
</body>
</html>

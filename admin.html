<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiteBari - Admin Dashboard</title>
    <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <style>
        .admin-container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 30px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        #dashboard { display: none; }
        .product-list { margin-top: 30px; }
        .product-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            border-bottom: 1px solid #eee;
        }
        .product-item img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; margin-right: 15px; }
        .product-item-info { flex: 1; }
        .product-item-actions { display: flex; gap: 10px; }
    </style>
</head>
<body>

    <!-- Login Section -->
    <div class="login-container" id="loginSection">
        <h3 class="text-center mb-4">Admin Login</h3>
        <input type="password" id="adminPassword" class="form-control mb-3" placeholder="Enter Admin Password">
        <button class="btn btn-primary w-100" onclick="login()">Login</button>
        <p id="loginError" class="text-danger mt-2 text-center" style="display:none;">Incorrect Password (hint: admin123)</p>
    </div>

    <!-- Dashboard Section -->
    <div class="admin-container" id="dashboard">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Admin Dashboard</h2>
            <button class="btn btn-danger" onclick="logout()">Logout</button>
        </div>

        <button class="btn btn-success mb-4" onclick="showAddForm()"><i class="fas fa-plus"></i> Add New Product</button>

        <div id="addFormSection" style="display: none;" class="mb-4 p-4 border rounded bg-light">
            <h4>Add / Edit Product</h4>
            <input type="hidden" id="p-id">
            <input type="text" id="p-name" class="form-control mb-2" placeholder="Product Name">
            <input type="number" id="p-price" class="form-control mb-2" placeholder="Price (৳)">
            <textarea id="p-desc" class="form-control mb-2" placeholder="Description"></textarea>
            
            <label class="form-label mt-2">Product Image</label>
            <div class="d-flex gap-2 mb-2">
                <input type="file" id="p-image-file" class="form-control" accept="image/*" onchange="previewImage(this)">
                <input type="text" id="p-img" class="form-control w-50" placeholder="Or Image URL">
            </div>
            <div id="uploadProgress" class="progress mb-2" style="display:none; height: 5px;">
                <div class="progress-bar" role="progressbar" style="width: 0%"></div>
            </div>
            <img id="imagePreview" src="img/product/placeholder.png" style="width: 80px; height: 80px; object-fit: cover; border-radius: 8px;" class="mb-3 border">
            
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="p-stock" checked>
                <label class="form-check-label" for="p-stock">In Stock</label>
            </div>
            <button class="btn btn-primary" id="saveBtn" onclick="saveProduct()">Save Product</button>
            <button class="btn btn-secondary" onclick="hideAddForm()">Cancel</button>
        </div>

        <div class="product-list" id="productList">
            <!-- Dynamic product list -->
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
    
    <script src="js/products-data.js"></script>
    <script>
        // Simple mock authentication
        let isLoggedIn = false;

        // Enter key listener
        document.getElementById('adminPassword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                login();
            }
        });

        function login() {
            const pass = document.getElementById('adminPassword').value;
            const errorEl = document.getElementById('loginError');
            
            // Reset error
            errorEl.style.display = 'none';

            if (pass === 'admin123') {
                isLoggedIn = true;
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                renderAdminProducts();
            } else {
                errorEl.style.display = 'block';
            }
        }

        function logout() {
            isLoggedIn = false;
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('adminPassword').value = '';
        }

        // Initialize Firebase Storage
        const storage = firebase.storage();

        // Listen for Firebase updates and re-render if logged in
        document.addEventListener('productsDataReady', () => {
            if (isLoggedIn) {
                renderAdminProducts();
            }
        });

        function previewImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('imagePreview').src = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function showAddForm(id = null) {
            document.getElementById('addFormSection').style.display = 'block';
            document.getElementById('p-image-file').value = '';
            document.getElementById('uploadProgress').style.display = 'none';
            
            if (id && window.PRODUCTS_DATA[id]) {
                const p = window.PRODUCTS_DATA[id];
                document.getElementById('p-id').value = id;
                document.getElementById('p-name').value = p.name;
                document.getElementById('p-price').value = p.price;
                document.getElementById('p-desc').value = p.description;
                document.getElementById('p-img').value = p.image;
                document.getElementById('imagePreview').src = p.image;
                document.getElementById('p-stock').checked = p.inStock;
            } else {
                document.getElementById('p-id').value = 'new_' + Date.now();
                document.getElementById('p-name').value = '';
                document.getElementById('p-price').value = '';
                document.getElementById('p-desc').value = '';
                document.getElementById('p-img').value = '';
                document.getElementById('imagePreview').src = 'img/product/placeholder.png';
                document.getElementById('p-stock').checked = true;
            }
        }

        function hideAddForm() {
            document.getElementById('addFormSection').style.display = 'none';
        }

        async function saveProduct() {
            const id = document.getElementById('p-id').value;
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const desc = document.getElementById('p-desc').value;
            const stock = document.getElementById('p-stock').checked;
            let imageUrl = document.getElementById('p-img').value;
            
            const file = document.getElementById('p-image-file').files[0];
            const saveBtn = document.getElementById('saveBtn');

            if (!name || !price) {
                alert("Please enter Name and Price");
                return;
            }

            saveBtn.disabled = true;
            saveBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Saving...';

            try {
                // Handle Image Upload if file selected
                if (file) {
                    document.getElementById('uploadProgress').style.display = 'block';
                    const storageRef = storage.ref('products/' + id + '_' + file.name);
                    const uploadTask = storageRef.put(file);

                    imageUrl = await new Promise((resolve, reject) => {
                        uploadTask.on('state_changed', 
                            (snapshot) => {
                                const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                                document.querySelector('#uploadProgress .progress-bar').style.width = progress + '%';
                            }, 
                            (error) => reject(error), 
                            () => {
                                uploadTask.snapshot.ref.getDownloadURL().then((downloadURL) => {
                                    resolve(downloadURL);
                                });
                            }
                        );
                    });
                }

                // Final save to Database
                window.PRODUCTS_DATA[id] = {
                    name: name,
                    price: parseFloat(price).toFixed(2),
                    description: desc,
                    image: imageUrl || 'img/product/8.png',
                    rating: 5,
                    inStock: stock
                };
                
                await saveProducts();
                hideAddForm();
                alert("Product saved successfully!");
            } catch (err) {
                console.error(err);
                alert("Error saving: " + err.message);
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerHTML = 'Save Product';
            }
        }

        function toggleAdminStock(id) {
            if (window.PRODUCTS_DATA[id]) {
                window.PRODUCTS_DATA[id].inStock = !window.PRODUCTS_DATA[id].inStock;
                saveProducts();
            }
        }

        function deleteProduct(id) {
            if (confirm("Are you sure you want to delete this product?")) {
                delete window.PRODUCTS_DATA[id];
                saveProducts();
            }
        }

        function renderAdminProducts() {
            const list = document.getElementById('productList');
            if (!list) return;
            
            list.innerHTML = '';
            for (let id in window.PRODUCTS_DATA) {
                const p = window.PRODUCTS_DATA[id];
                const item = document.createElement('div');
                item.className = 'product-item';
                item.innerHTML = `
                    <div class="d-flex align-items-center">
                        <img src="${p.image}" alt="${p.name}" onerror="this.src='img/product/8.png'">
                        <div class="product-item-info">
                            <h5>${p.name}</h5>
                            <span class="badge ${p.inStock ? 'bg-success' : 'bg-danger'}">${p.inStock ? 'In Stock' : 'Out of Stock'}</span>
                            <span class="ms-2 fw-bold">৳ ${p.price}</span>
                        </div>
                    </div>
                    <div class="product-item-actions">
                        <button class="btn btn-sm btn-outline-primary" onclick="toggleAdminStock('${id}')">Toggle Stock</button>
                        <button class="btn btn-sm btn-outline-secondary" onclick="showAddForm('${id}')"><i class="fas fa-edit"></i> Edit</button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteProduct('${id}')"><i class="fas fa-trash"></i> Delete</button>
                    </div>
                `;
                list.appendChild(item);
            }
        }
    </script>
</body>
</html>
